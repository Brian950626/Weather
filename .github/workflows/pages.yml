name: 更新預報網頁

on:
  push:
    branches: [main]
  schedule:
    # 目標是大約每 6 小時更新一次。GitHub 的排程常常延後,有時整班跳過,所以改成每小時
    # 檢查一次:上一次發布還不到 5 小時就直接結束,超過才重算。這樣漏掉一班,下一個小時就補上。
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 要顯示的地點,以空白分隔,第一個是網頁預設顯示的地點。
  # 台灣各縣市與枋寮可直接用中文;其他鄉鎮用「名稱@緯度,經度」,例如 恆春@22.00,120.75
  PLACES: 枋寮 台北 台中 高雄 花蓮

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 測試
        run: python -m unittest -q
      - uses: actions/configure-pages@v5
        id: pages
      - name: 取得上一次發布的預報(用來比較預報趨勢;第一次發布時沒有,略過)
        run: curl -fsSL --max-time 30 -o previous.json "${{ steps.pages.outputs.base_url }}/data.json" || rm -f previous.json
      - name: 產生網頁(排程觸發時,資料還新就略過)
        id: site
        run: |
          fresh=""
          if [ "${{ github.event_name }}" = "schedule" ]; then fresh="--only-if-older-than 5"; fi
          python -m weekcast.site --out _site --previous previous.json $fresh $PLACES
          if [ -f _site/index.html ]; then echo "built=true" >> "$GITHUB_OUTPUT"; else echo "built=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.built == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
